THP_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: reduced_taxi_.1
    runner_id: std_tpp
    model_id: THP
    base_dir: /home/guangchen_li/dev/Easy_TPP/results/checkpoints/
  trainer_config:
    batch_size: 4
    max_epoch: 40
    shuffle: True
    optimizer: adam
    learning_rate: 1.e-3
    valid_freq: 1
    use_tfb: False
    metrics: ['acc', 'rmse']
    seed: 1234
    gpu: 5
  model_config:
    hidden_size: 64
    time_emb_size: 64
    num_layers: 4
    num_heads: 4
    mc_num_sample_per_step: 20
    loss_integral_num_sample_per_step: 20
    w_mle: 1
    w_dis: 1
    use_ln: True
    thinning:
      num_seq: 10
      num_sample: 1
      num_exp: 500
      look_ahead_time: 10
      patience_counter: 5
      over_sample_rate: 5
      num_samples_boundary: 5
      dtime_max: 5
      num_step_gen: 1
AttNHP_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: reduced_taxi_.25
    runner_id: std_tpp
    model_id: AttNHP # model name
    base_dir: './checkpoints/'
  trainer_config:
    batch_size: 4
    max_epoch: 50
    shuffle: False
    optimizer: adam
    learning_rate: 1.e-3
    valid_freq: 1
    use_tfb: False
    metrics: [ 'acc', 'rmse' ]
    seed: 2019
    gpu: 3
  model_config:
    hidden_size: 64
    time_emb_size: 64
    num_layers: 4
    num_heads: 4
    loss_integral_num_sample_per_step: 10
    use_ln: False
    thinning:
      num_seq: 2
      num_sample: 1
      num_exp: 50 # number of i.i.d. Exp(intensity_bound) draws at one time in thinning algorithm
      look_ahead_time: 10
      patience_counter: 5 # the maximum iteration used in adaptive thinning
      over_sample_rate: 5
      num_samples_boundary: 5
      dtime_max: 5
      num_step_gen: 1
